services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cur-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - cur-net

  frontend:
    build:
      context: ./frontend
    container_name: cur-frontend
    expose:
      - "80"
    networks:
      - cur-net

  backend:
    build:
      context: ./backend
    container_name: cur-backend
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - cur-net

  database:
    image: postgres:16-alpine
    container_name: cur-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_cost}
      POSTGRES_USER: ${POSTGRES_USER:-cloud_cost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud_cost_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cur-net

networks:
  cur-net:
    driver: bridge

volumes:
  postgres_data:
